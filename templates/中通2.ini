中通2.0版本复盘会议
研发复盘相关：
1. 接口字段变化的维护方案，后端改动接口后应该采用什么形式同步到前端，以提升需求开发联调效率；--待研发后续讨论具体方案；
2.研发在接口开发完成后进行接口单元测试的颗粒度应细化到什么程度；--待研发后续讨论具体方案；
3.研发对测试的改进期望：1.测试在将问题提交到禅道上之后，对于出现问题的数据，先找研发确认下此问题数据是否需要留给开发进行问题定位，开发在接到bug指派之后，也应及时找测试进行沟通，以提升问题解决效率；
4.对于中通2.0历史数据的处理方案，应提前确定下来，避免此次出现的历史数据方案多次变更的情况，影响上线进度；
5.中通原有的H5供应商注册页面，各个环节全部遗漏，对于这种某个系统的个性化功能，在需求初期就应该提出了，避免后期的补充，影响上线进度；
